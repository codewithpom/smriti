name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  functions:
    name: Functions tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24 # --test-isolation needs Node 23.6+
      - run: node --test --test-isolation=none tests/*.test.mjs
        working-directory: gallery/functions

  python:
    name: Pipeline and demo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pillow numpy scipy networkx==3.3 scikit-learn==1.5.2 opencv-python-headless==4.10.0.84 cryptography==48.0.0
      - run: python -m unittest test_tally test_obfuscate test_filter_batch test_name_sheet test_apply_cluster_names test_fetch_students test_people_store test_import_extra_people test_import_names_csv test_eval_match test_eval_groups test_faces_decide test_auto_people test_ingest_facebook test_aliases test_aliases_more test_new_person test_new_staff test_new_student_noreg test_dedupe test_face_quality test_faces_cluster test_remote test_ci_scan test_migrate_storage test_recover_archive test_encrypted_backup test_recover_ci test_finalize_recovery test_repair_recovery_ci
        working-directory: gallery/pipeline
      - run: python gallery/demo/check_demo.py

  rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
        working-directory: gallery/tests
      - run: npm test
        working-directory: gallery/tests
