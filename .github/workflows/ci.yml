name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  functions:
    name: Functions tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # --test-isolation needs Node 23.6+
      - run: node --test --test-isolation=none tests/*.test.mjs
        working-directory: gallery/functions

  python:
    name: Pipeline and demo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow numpy
      - run: python -m unittest test_tally test_obfuscate test_filter_batch test_name_sheet test_apply_cluster_names test_fetch_students test_people_store test_import_extra_people test_import_names_csv test_eval_match test_eval_groups test_faces_decide test_aliases test_aliases_more test_new_person test_new_staff test_new_student_noreg
        working-directory: gallery/pipeline
      - run: python gallery/demo/check_demo.py

  rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
        working-directory: gallery/tests
      - run: npm test
        working-directory: gallery/tests
