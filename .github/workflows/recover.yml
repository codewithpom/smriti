name: Recover archive

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan-pipeline
  cancel-in-progress: false

jobs:
  recover:
    if: ${{ github.ref == 'refs/heads/automation/scan' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RECOVERY_BACKUP_PASSWORD: ${{ secrets.RECOVERY_BACKUP_PASSWORD }}
      IMG_KEY: ${{ secrets.IMG_KEY }}
      STORAGE_BACKEND: kv
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
      PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set private working directories
        run: |
          echo "RKMV_SOURCE=$RUNNER_TEMP/recovered-source" >> "$GITHUB_ENV"
          echo "RKMV_PEOPLE=$RUNNER_TEMP/recovered-people" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: gallery/pipeline/requirements-scan.txt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.insightface
          key: insightface-recovery-v1
      - name: Install recovery dependencies
        run: python -m pip install -r gallery/pipeline/requirements-scan.txt cryptography==48.0.0
      - name: Decrypt private recovery inputs
        run: python gallery/pipeline/encrypted_backup.py unpack backups/bootstrap "$RUNNER_TEMP/recovery-input"
      - name: Rebuild, verify and seed private storage
        run: python gallery/pipeline/recover_ci.py --input "$RUNNER_TEMP/recovery-input" --backup "$RUNNER_TEMP/recovery-backup"
      - name: Encrypt rebuilt state
        run: python gallery/pipeline/encrypted_backup.py pack "$RUNNER_TEMP/recovery-backup" "$RUNNER_TEMP/encrypted-result"
      - name: Commit encrypted backup to scan branch
        run: |
          mkdir -p backups/recovery
          rm -f backups/recovery/*
          cp "$RUNNER_TEMP/encrypted-result/"* backups/recovery/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- backups/recovery
          git commit -m 'chore: save encrypted recovered archive'
          git push origin HEAD:automation/scan
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Publish verified recovered gallery
        run: |
          python gallery/pipeline/ci_scan.py --publish-dir "$RUNNER_TEMP/recovered-site"
          cd "$RUNNER_TEMP/recovered-site"
          npx --yes wrangler@4.159.0 pages deploy --branch main --commit-dirty=true
      - name: Activate recovered gallery data
        run: python gallery/pipeline/recover_ci.py --activate "$RUNNER_TEMP/recovery-backup/site-data"
