name: Repair cached recovery embeddings

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan-pipeline
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ github.ref == 'refs/heads/automation/scan' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RECOVERY_BACKUP_PASSWORD: ${{ secrets.RECOVERY_BACKUP_PASSWORD }}
      IMG_KEY: ${{ secrets.IMG_KEY }}
      STORAGE_BACKEND: kv
      KV_DAILY_BUDGET: "900"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          sparse-checkout: |
            gallery
            backups/bootstrap
            backups/recovery
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gallery/pipeline/requirements-scan.txt
      - name: Install pinned recovery dependencies
        run: python -m pip install -r gallery/pipeline/requirements-scan.txt cryptography==48.0.0
      - name: Decrypt existing recovery backup
        run: python gallery/pipeline/encrypted_backup.py unpack backups/recovery "$RUNNER_TEMP/recovery-backup"
      - name: Decrypt original archive snapshot
        run: python gallery/pipeline/encrypted_backup.py unpack backups/bootstrap "$RUNNER_TEMP/recovery-input"
      - name: Detect an already committed prepared repair
        id: prepared
        run: |
          if [ -f "$RUNNER_TEMP/recovery-backup/repairs/repair-transaction.json" ]; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            cp -a "$RUNNER_TEMP/recovery-backup" "$RUNNER_TEMP/repaired-backup"
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare repaired recovery backup without cloud writes
        if: steps.prepared.outputs.reuse != 'true'
        run: >-
          python gallery/pipeline/repair_recovery_ci.py prepare
          "$RUNNER_TEMP/recovery-backup"
          "$RUNNER_TEMP/repaired-backup"
          "$RUNNER_TEMP/recovery-input/archive"
      - name: Encrypt prepared recovery backup
        if: steps.prepared.outputs.reuse != 'true'
        run: python gallery/pipeline/encrypted_backup.py pack "$RUNNER_TEMP/repaired-backup" "$RUNNER_TEMP/encrypted-recovery"
      - name: Commit recovery snapshot before cloud changes
        if: steps.prepared.outputs.reuse != 'true'
        run: |
          rm -f backups/recovery/*
          cp "$RUNNER_TEMP/encrypted-recovery/"* backups/recovery/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- backups/recovery
          git commit -m 'chore: repair cached recovery embeddings'
          git push origin HEAD:automation/scan
      - name: Apply prepared repair to cloud
        run: >-
          python gallery/pipeline/repair_recovery_ci.py apply
          "$RUNNER_TEMP/recovery-backup"
          "$RUNNER_TEMP/repaired-backup"
          "$RUNNER_TEMP/recovery-input/archive"
