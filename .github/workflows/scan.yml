name: scan
# Photo pipeline on GitHub. This repo is PUBLIC, so run logs are world-readable:
#   - logs print counts only; never expose keys, names, ids, cookies or photo data
#   - no artifacts are uploaded, and secrets never reach pull_request workflows
#   - photos, embeddings and cookies live only in the private storage backend
on:
  workflow_dispatch:
    inputs:
      fetch_facebook: { description: "Fetch saved Facebook page", type: boolean, default: false }
      recluster: { description: "Recluster unknown faces", type: boolean, default: false }
      reembed: { description: "Re-embed originals (R2 only)", type: boolean, default: false }
      eval: { description: "Run match evaluation", type: boolean, default: false }
      migrate_from: { description: "Migrate from a backend", type: choice, options: ["", kv, r2], default: "" }
      verbose: { description: "Print pipeline stdout", type: boolean, default: false }
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
concurrency:
  group: scan-pipeline
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      STORAGE_BACKEND: ${{ vars.STORAGE_BACKEND || 'kv' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_REGION: auto
      RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      IMG_KEY: ${{ secrets.IMG_KEY }}
      RKMV_SOURCE: ${{ github.workspace }}/sorted
      RKMV_PEOPLE: ${{ github.workspace }}/hello/data
      GITHUB_SERVER_URL: ${{ github.server_url }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gallery/pipeline/requirements-scan.txt
      - name: Cache insightface models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with: { path: ~/.insightface, key: "insightface-${{ hashFiles('gallery/pipeline/requirements-scan.txt') }}" }
      - name: Cache published images
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with: { path: ~/.cache/smriti-img, key: "smriti-img-${{ github.run_id }}", restore-keys: smriti-img- }
      - name: Install rclone
        if: ${{ env.STORAGE_BACKEND == 'r2' || inputs.migrate_from == 'r2' }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone
      - name: Install pipeline dependencies
        run: python -m pip install -r gallery/pipeline/requirements-scan.txt
      - name: Run incremental scan
        id: scan
        run: |
          args=()
          [ "${{ inputs.fetch_facebook }}" = "true" ] && args+=(--fetch-facebook)
          [ "${{ inputs.recluster }}" = "true" ] && args+=(--recluster)
          [ "${{ inputs.reembed }}" = "true" ] && args+=(--reembed)
          [ "${{ inputs.eval }}" = "true" ] && args+=(--eval)
          [ "${{ inputs.verbose }}" = "true" ] && args+=(--verbose)
          [ -n "${{ inputs.migrate_from }}" ] && args+=(--migrate-from "${{ inputs.migrate_from }}")
          python gallery/pipeline/ci_scan.py "${args[@]}"
      - name: Set up Node for publish
        if: ${{ steps.scan.outputs.publish == 'true' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Publish gallery
        # Site + obfuscated images + Functions, with a generated wrangler.toml that binds PHOTOS to the chosen storage.
        # Data JSON is never part of the static site: the login-checked Function serves it from storage.
        if: ${{ steps.scan.outputs.publish == 'true' }}
        env:
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          python gallery/pipeline/ci_scan.py --publish-dir "$RUNNER_TEMP/site"
          cd "$RUNNER_TEMP/site" && npx --yes wrangler@4.159.0 pages deploy --commit-dirty=true
