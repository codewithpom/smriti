name: Finalize recovered image baseline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scan-pipeline
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ github.ref == 'refs/heads/automation/scan' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RECOVERY_BACKUP_PASSWORD: ${{ secrets.RECOVERY_BACKUP_PASSWORD }}
      IMG_KEY: ${{ secrets.IMG_KEY }}
      STORAGE_BACKEND: kv
      KV_DAILY_BUDGET: "900"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
      PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            gallery
            backups/recovery
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gallery/pipeline/requirements-scan.txt
      - name: Install pinned recovery dependencies
        run: python -m pip install -r gallery/pipeline/requirements-scan.txt cryptography==48.0.0
      - name: Decrypt private recovery backup
        run: python gallery/pipeline/encrypted_backup.py unpack backups/recovery "$RUNNER_TEMP/recovery-backup"
      - name: Canonicalize baseline avatars and seed delta manifest
        run: python gallery/pipeline/finalize_recovery.py "$RUNNER_TEMP/recovery-backup"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Publish recovered static assets
        run: |
          python gallery/pipeline/ci_scan.py --publish-dir "$RUNNER_TEMP/recovered-site"
          cd "$RUNNER_TEMP/recovered-site"
          npx --yes wrangler@4.159.0 pages deploy --branch main --commit-dirty=true
      - name: Verify recovery bundle and activate gallery data
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          backup = Path(os.environ["RUNNER_TEMP"]) / "recovery-backup"
          data = backup / "data"
          site_data = backup / "site-data"
          report = json.loads((data / "recovery_report.json").read_text(encoding="utf-8"))
          for key in ("photos", "people", "preserved_labels"):
              if type(report.get(key)) is not int or report[key] < 0:
                  raise SystemExit("recovery verification report is invalid")
          if report["photos"] == 0 or report["people"] == 0:
              raise SystemExit("recovery verification report is incomplete")
          original = json.loads((data / "photos.json").read_text(encoding="utf-8"))
          deployed = json.loads((site_data / "photos.json").read_text(encoding="utf-8"))
          if not isinstance(original, list) or not isinstance(deployed, list):
              raise SystemExit("recovered photo data is invalid")
          if len(original) != report["photos"] or len(deployed) != report["photos"]:
              raise SystemExit("recovered photo count does not match the verified archive")
          for name in ("people", "graph", "questions", "clusters"):
              json.loads((site_data / f"{name}.json").read_text(encoding="utf-8"))
          PY
          python gallery/pipeline/recover_ci.py --activate "$RUNNER_TEMP/recovery-backup/site-data"
